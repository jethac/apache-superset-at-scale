name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default; jobs opt in to more where they need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, typecheck, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install from the hash-pinned lock file
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.txt
          python -m pip install --no-deps .
          # The dev tools come from the `dev` extra rather than a second list of
          # pins here: a duplicated list drifts, and a dependency bump that CI
          # does not install is a bump nothing has tested.
          python -m pip install -e ".[dev]"

      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

      - name: Offline simulation must reconcile
        run: scoreboard simulate --events 64
        env:
          DB_PATH: ${{ runner.temp }}/facts.db

  docker:
    name: image builds and runs offline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5  # v3.8.0

      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: .
          push: false
          load: true
          tags: scoreboard:ci

      - name: Simulation runs with no network and no credentials
        run: |
          docker run --rm --network none \
            -e DB_PATH=/tmp/facts.db \
            scoreboard:ci simulate --events 32

      - name: Container does not run as root
        run: |
          uid="$(docker run --rm --entrypoint id scoreboard:ci -u)"
          test "$uid" != "0"
