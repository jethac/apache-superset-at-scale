name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a dependency that becomes vulnerable after merge is still caught.
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@8c78abb9b62512e3c45dea6559ffd924ed8549c8  # v3.28.0
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@8c78abb9b62512e3c45dea6559ffd924ed8549c8  # v3.28.0

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019  # v4.5.0
        with:
          fail-on-severity: moderate

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3  # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfile:
    name: Lock file is current and hash-pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@887a942a15af3a7626099df99e897a18d9e5ab3a  # v5.1.0
        with:
          version: "0.5.14"
      - name: Recompile and diff
        run: |
          uv pip compile pyproject.toml --generate-hashes --python-version 3.12 \
            -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt

  actions-pinned:
    name: Actions are pinned to commit SHAs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Reject any `uses:` on a mutable tag or branch
        run: |
          if grep -rEn '^\s*-?\s*uses:\s*[^@]+@(?![0-9a-f]{40}\b)' .github/workflows; then
            echo "::error::every action must be pinned to a full 40-character commit SHA"
            exit 1
          fi
