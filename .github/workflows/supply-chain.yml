name: Supply chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so a dependency that becomes vulnerable after merge is still caught.
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3.37.6
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b  # v3.37.6
        with:
          # The queries run either way; only the SARIF upload needs the code
          # scanning API, which private repos get only with GitHub Advanced
          # Security. Make the repo public (or enable GHAS) to get alerts.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    # The action requires the dependency graph, which private repos only get with
    # GitHub Advanced Security.
    if: github.event_name == 'pull_request' && !github.event.repository.private
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lockfile:
    name: Lock file is current and hash-pinned
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.7.9"
      - name: Recompile and diff
        # --exclude-newer keeps resolution reproducible: a transitive release made
        # after this date cannot change the result, so the diff only fails when an
        # input actually changed.
        run: |
          compile() {
            uv pip compile "$1" --generate-hashes --no-header \
              --python-version 3.12 --exclude-newer "$EXCLUDE_NEWER" -o "$2"
          }
          compile pyproject.toml /tmp/requirements.txt
          compile requirements-build.in /tmp/requirements-build.txt
          diff -u requirements.txt /tmp/requirements.txt
          diff -u requirements-build.txt /tmp/requirements-build.txt
        env:
          EXCLUDE_NEWER: "2026-08-02T00:00:00Z"

  actions-pinned:
    name: Actions are pinned to commit SHAs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - name: Reject any `uses:` on a mutable tag or branch
        run: |
          if grep -rEn '^\s*-?\s*uses:\s*[^@]+@(?![0-9a-f]{40}\b)' .github/workflows; then
            echo "::error::every action must be pinned to a full 40-character commit SHA"
            exit 1
          fi
