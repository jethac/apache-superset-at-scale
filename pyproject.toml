[project]
name = "scoreboard"
version = "0.1.0"
description = "Devin @ apache/superset: event-driven Devin automation and its scoreboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.1",
    "types-pyyaml==6.0.12.20241230",
]

[project.scripts]
scoreboard = "scoreboard.cli:main"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scoreboard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["scoreboard"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
